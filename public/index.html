<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador — Agente de WhatsApp</title>
<style>
  :root{
    --azul:#1B3A6B; --azul-2:#274E8C; --dorado:#C9A84C;
    --verde:#27AE60; --verde-bg:#E8F8F0; --verde-ink:#1A6B3A;
    --rojo:#E74C3C; --rojo-bg:#FDEEEE; --rojo-ink:#922B1A;
    --naranja:#E8792E; --naranja-bg:#FFF3EA; --naranja-ink:#8A4B14;
    --fondo:#F0F4F8; --blanco:#fff; --borde:#DCE3EC; --texto:#1F2733; --texto-suave:#5C6B7A;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--fondo); color:var(--texto);}
  header{background:linear-gradient(135deg,var(--azul),var(--azul-2)); color:#fff; padding:22px 20px; text-align:center;}
  header h1{margin:0; font-size:1.4rem;}
  header p{margin:6px 0 0; opacity:.85; font-size:.9rem;}
  main{max-width:640px; margin:0 auto; padding:24px 16px 60px;}
  .card{background:var(--blanco); border-radius:14px; padding:22px; box-shadow:0 4px 15px rgba(0,0,0,.08); margin-bottom:18px;}
  label{display:block; font-weight:700; font-size:.85rem; color:var(--azul); margin-bottom:8px;}
  textarea{width:100%; min-height:90px; border:2px solid var(--borde); border-radius:10px; padding:12px; font-size:1rem; font-family:inherit; resize:vertical;}
  textarea:focus{outline:none; border-color:var(--azul);}
  .ejemplos{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .chip{border:1.5px solid var(--borde); background:var(--fondo); color:var(--texto-suave); font-size:.78rem; padding:6px 12px; border-radius:999px; cursor:pointer;}
  .chip:hover{border-color:var(--azul); color:var(--azul);}
  .btn{margin-top:16px; width:100%; padding:13px; border:none; border-radius:10px; background:var(--dorado); color:var(--azul); font-weight:800; font-size:1rem; cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.6; cursor:default;}
  #resultado{display:none;}
  .burbuja{border-radius:14px; padding:14px 16px; margin-bottom:12px; font-size:.95rem; line-height:1.5;}
  .burbuja-trabajadora{background:var(--fondo); border:1px solid var(--borde);}
  .burbuja-bot{background:var(--verde-bg); color:var(--verde-ink); border-left:4px solid var(--verde);}
  .burbuja-escalado{border-left:4px solid; }
  .badge{display:inline-block; font-size:.68rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:3px 10px; border-radius:999px; margin-bottom:8px;}
  .badge-urgente{background:var(--rojo-bg); color:var(--rojo-ink);}
  .badge-importante{background:var(--naranja-bg); color:var(--naranja-ink);}
  .badge-normal{background:var(--verde-bg); color:var(--verde-ink);}
  .meta{font-size:.75rem; color:var(--texto-suave); margin-top:10px;}
  .error{background:var(--rojo-bg); color:var(--rojo-ink); border-radius:10px; padding:14px; font-size:.9rem;}
  footer{text-align:center; padding:20px; color:#8A94A3; font-size:.78rem;}
</style>
</head>
<body>
  <header>
    <h1>🧪 Simulador del agente</h1>
    <p>Prueba cómo clasificaría y respondería el bot un mensaje, sin necesidad de WhatsApp conectado</p>
  </header>

  <main>
    <div class="card">
      <label for="texto">Mensaje de prueba (como si lo escribiera una trabajadora)</label>
      <textarea id="texto" placeholder="Ej: ¿Qué producto uso para limpiar los vidrios?"></textarea>
      <div class="ejemplos" id="ejemplos"></div>
      <button class="btn" id="btnProbar">Probar clasificación →</button>
    </div>

    <div class="card" id="resultado"></div>
  </main>

  <footer>Este simulador no envía mensajes reales ni guarda datos — solo corre la clasificación.</footer>

<script>
  const EJEMPLOS = [
    "¿Qué producto uso para limpiar los vidrios?",
    "Mañana no puedo llegar, tengo hora médica en la mañana",
    "Se resbaló una compañera y se golpeó fuerte la cabeza, está mareada",
    "Buenos días",
    "El cliente de hoy me trató muy mal, no sé qué hacer",
    "¿A qué hora tengo que llegar mañana?",
  ];

  const ejemplosDiv = document.getElementById('ejemplos');
  const textoEl = document.getElementById('texto');
  EJEMPLOS.forEach((ej) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = ej.length > 40 ? ej.slice(0, 40) + '…' : ej;
    chip.title = ej;
    chip.addEventListener('click', () => { textoEl.value = ej; });
    ejemplosDiv.appendChild(chip);
  });

  const btn = document.getElementById('btnProbar');
  const resultadoDiv = document.getElementById('resultado');

  function badgeClase(categoria) {
    if (categoria === 'urgente') return 'badge-urgente';
    if (categoria === 'importante') return 'badge-importante';
    return 'badge-normal';
  }

  function colorEscalado(categoria) {
    if (categoria === 'urgente') return 'var(--rojo)';
    if (categoria === 'importante') return 'var(--naranja)';
    return 'var(--verde)';
  }

  btn.addEventListener('click', async () => {
    const texto = textoEl.value.trim();
    if (!texto) { textoEl.focus(); return; }

    btn.disabled = true;
    btn.textContent = 'Clasificando…';
    resultadoDiv.style.display = 'block';
    resultadoDiv.innerHTML = '<p style="color:var(--texto-suave)">Consultando a Claude…</p>';

    try {
      const res = await fetch('/api/simular', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto }),
      });
      const data = await res.json();

      if (!res.ok) {
        resultadoDiv.innerHTML = `<div class="error"><b>No se pudo clasificar:</b><br>${data.error ?? 'Error desconocido'}<br><br>Verifica que ANTHROPIC_API_KEY esté configurada en tu .env y que el servidor se haya reiniciado.</div>`;
        return;
      }

      let html = `<div class="burbuja burbuja-trabajadora"><b>Trabajadora:</b><br>${texto}</div>`;

      if (data.respuesta_automatica) {
        html += `<div class="burbuja burbuja-bot"><b>🤖 Respuesta automática del bot:</b><br>${data.respuesta_automatica}</div>`;
      }

      if (data.escalar_a_supervisora) {
        html += `<div class="burbuja burbuja-escalado" style="border-left-color:${colorEscalado(data.categoria)}; background:#fafbfc;">
          <span class="badge ${badgeClase(data.categoria)}">${data.categoria}</span><br>
          <b>📨 Se escala a la supervisora:</b><br>${data.resumen_para_supervisora ?? texto}
        </div>`;
      } else if (!data.respuesta_automatica) {
        html += `<div class="burbuja" style="background:#fafbfc;">El bot no responde ni escala este mensaje.</div>`;
      }

      html += `<div class="meta">tipo_contenido: <b>${data.tipo_contenido}</b> · categoría: <b>${data.categoria}</b></div>`;

      resultadoDiv.innerHTML = html;
    } catch (err) {
      resultadoDiv.innerHTML = `<div class="error">Error de conexión con el servidor.</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Probar clasificación →';
    }
  });
</script>
</body>
</html>
